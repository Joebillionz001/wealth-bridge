<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - WealthBridge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div id="spinner-overlay" class="spinner-overlay hidden">
        <div class="spinner"></div>
    </div>

    <div id="notification-container"></div>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WealthBridge</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <nav class="main-nav">
                <ul id="main-nav-links">
                    <!-- Links are dynamically populated by auth.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h1>Verify Your Email</h1>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">We've sent a verification code to your email.</p>
            <form id="verify-email-form" class="form-stacked">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required readonly style="background-color: var(--secondary-color);">
                </div>
                <div class="form-group">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" name="code" placeholder="Enter 6-digit code" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary">Verify Account</button>
                <button type="button" id="resend-code-btn" class="btn btn-secondary" style="margin-top: 10px;">Resend Code</button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 WealthBridge. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
