<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - WealthBridge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div id="spinner-overlay" class="spinner-overlay hidden"><div class="spinner"></div></div>
    <div id="notification-container"></div>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WealthBridge</a>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h1>Reset Password</h1>
            <p style="text-align: center; margin-bottom: 1.5rem;">Enter your email to receive a password reset link.</p>
            
            <form id="forgot-password-form" class="form-stacked">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>
            <p class="form-switch"><a href="login.html">Back to Login</a></p>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
