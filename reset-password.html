<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Wealth Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="preloader">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">Wealth Bridge</a>
            <button class="nav-toggle" aria-label="toggle navigation">&#9776;</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="services.html">Services</a>
                <a href="investment-plans.html">Invest</a>
                <a href="resources.html">Resources</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html">Contact</a>
                <div id="user-auth-links" style="display: flex;">
                    <a href="login.html" id="login-link">Login</a>
                    <a href="signup.html" id="signup-link">Sign Up</a>
                </div>
                <div id="user-profile-links" style="display: none;">
                    <a href="profile.html" id="profile-link">Profile</a>
                    <a href="my-portfolio.html" id="portfolio-link">My Portfolio</a>
                    <a href="settings.html" id="settings-link">Settings</a>
                    <a href="#" id="logout-link">Logout</a>
                </div>
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="theme-switch">
                        <input type="checkbox" id="theme-switch" />
                        <div class="slider"></div>
                    </label>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h2>Reset Your Password</h2>
            <div id="message" class="message" style="text-align: left;"></div>
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new-password" required aria-describedby="new-password-error" aria-invalid="false">
                    <div class="error-text" id="new-password-error"></div>
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" name="confirm-new-password" required aria-describedby="confirm-password-error" aria-invalid="false">
                    <div class="error-text" id="confirm-password-error"></div>
                </div>
                <button type="submit" class="submit-button">Reset Password</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Wealth Bridge. All Rights Reserved. | <a href="privacy-policy.html" style="color: #e0e0e0;">Privacy Policy</a> | <a href="terms-of-service.html" style="color: #e0e0e0;">Terms of Service</a> | <a href="sitemap.html" style="color: #e0e0e0;">Sitemap</a></p>
            <p>Your Trusted Partner in Financial Growth</p>
        </div>
    </footer>

    <script src="scripts.js" type="module" defer></script>
    <script>
        // Hide preloader when page is fully loaded
        window.addEventListener('load', () => {
            document.querySelector('.preloader').classList.add('hidden');
        });
    </script>
    <script>
        // Trigger animation on page load
        window.addEventListener('load', () => {
            document.querySelector('.auth-container').classList.add('loaded');
        });
    </script>
</body>
</html>
