<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - WealthBridge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div id="spinner-overlay" class="spinner-overlay hidden">
        <div class="spinner"></div>
    </div>

    <div id="notification-container"></div>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WealthBridge</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <nav class="main-nav">
                <ul id="main-nav-links">
                    <!-- Links are dynamically populated by auth.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Settings</h1>
        <p>Manage your application preferences.</p>

        <section class="card">
            <h2>Notifications</h2>
            <div class="form-group">
                <label class="switch">
                    <input type="checkbox" id="email-notifications-toggle" checked>
                    <span class="slider round"></span>
                </label>
                <span>Email me with profit and maturity updates.</span>
            </div>
        </section>

        <section class="card">
            <h2>Appearance</h2>
            <div class="form-group">
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider round"></span>
                </label>
                <span>Dark Mode</span>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 WealthBridge. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Terms & Conditions</a>
            </div>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
