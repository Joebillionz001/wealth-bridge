<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - WealthBridge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div id="spinner-overlay" class="spinner-overlay hidden">
        <div class="spinner"></div>
    </div>

    <div id="notification-container"></div>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WealthBridge</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <nav class="main-nav">
                <ul id="main-nav-links">
                    <!-- Links are dynamically populated by auth.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Account Settings</h1>

        <!-- Appearance Settings -->
        <section class="card">
            <h2>Appearance</h2>
            <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                <label for="dark-mode-toggle" style="margin: 0; font-weight: 500;">Dark Mode</label>
                <label class="checkbox-container" style="margin: 0;">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="checkmark" style="position: relative; display: inline-block;"></span>
                </label>
            </div>
        </section>

        <!-- Notification Settings -->
        <section class="card">
            <h2>Notifications</h2>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="checkbox-container">
                    Email Notifications (Deposits, Withdrawals)
                    <input type="checkbox" id="email-notifications" checked>
                    <span class="checkmark"></span>
                </label>
            </div>
            <div class="form-group">
                <label class="checkbox-container">
                    SMS Notifications (Security Alerts)
                    <input type="checkbox" id="sms-notifications">
                    <span class="checkmark"></span>
                </label>
            </div>
        </section>

        <!-- Danger Zone -->
        <section class="card" style="border: 1px solid var(--danger-color);">
            <h2 style="color: var(--danger-color);">Danger Zone</h2>
            <p>Once you delete your account, there is no going back. Please be certain.</p>
            <button id="delete-account-btn" class="btn btn-danger">Delete Account</button>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 WealthBridge. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Terms & Conditions</a>
            </div>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
