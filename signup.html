<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WealthBridge</title>
    <link rel="stylesheet" href="style.css">
    <!-- Assuming auth.css exists as referenced in login.html -->
    <link rel="stylesheet" href="auth.css"> 
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div id="spinner-overlay" class="spinner-overlay hidden">
        <div class="spinner"></div>
    </div>

    <div id="notification-container"></div>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WealthBridge</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <nav class="main-nav">
                <ul id="main-nav-links">
                    <!-- Links are dynamically populated by auth.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h1>Create Your Account</h1>
            <form id="signupForm" class="form-stacked">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                    <!-- Password Strength Indicator -->
                    <div id="password-strength-container" class="strength-container">
                        <div class="strength-bar"></div>
                    </div>
                    <small id="password-strength-text"></small>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="referral-code">Referral Code (Optional)</label>
                    <input type="text" id="referral-code" name="referral-code" placeholder="e.g. WB-1234">
                </div>
                <div class="form-group">
                    <label class="checkbox-container">
                        I agree to the <a href="terms.html">Terms & Conditions</a>
                        <input type="checkbox" required>
                        <span class="checkmark"></span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>

            <div class="auth-divider"><span>OR</span></div>
            <button id="google-auth-btn" class="btn btn-google" type="button">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                Sign up with Google
            </button>

            <p class="form-switch">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 WealthBridge. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="terms.html">Terms & Conditions</a>
            </div>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
