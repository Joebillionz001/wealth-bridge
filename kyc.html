<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification - WealthBridge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div id="spinner-overlay" class="spinner-overlay hidden">
        <div class="spinner"></div>
    </div>
    <div id="notification-container"></div>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">WealthBridge</a>
            <nav class="main-nav">
                <ul id="main-nav-links">
                    <!-- Links are dynamically populated by auth.js -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container" style="max-width: 600px;">
            <h1>Identity Verification</h1>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">To comply with financial regulations, please verify your identity to unlock full account features.</p>
            
            <form id="kyc-form" class="form-stacked">
                <div class="form-group">
                    <label for="full-name">Full Legal Name</label>
                    <input type="text" id="full-name" name="fullName" required>
                </div>
                
                <div class="form-group">
                    <label for="document-type">Document Type</label>
                    <select id="document-type" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 4px;" required>
                        <option value="passport">International Passport</option>
                        <option value="driver_license">Driver's License</option>
                        <option value="id_card">National ID Card</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="id-document">Upload Document Image (Front)</label>
                    <input type="file" id="id-document" accept="image/*" required style="border: none; padding-left: 0;">
                    <small style="color: var(--text-muted);">Max size: 5MB. Formats: JPG, PNG.</small>
                </div>

                <button type="submit" class="btn btn-primary">Submit for Review</button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content"><p>&copy; 2024 WealthBridge. All rights reserved.</p></div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
